<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提瓦特旅人录</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060c2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="提瓦特旅人录">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 页面头部 -->
  <header class="site-header">
    <h1 class="site-title">提瓦特旅人录</h1>
    <p class="site-subtitle">穿越星海，邂逅这片大陆上的每一位旅伴</p>
  </header>

  <!-- 筛选栏 -->
  <section class="filter-bar">
    <div class="filter-group">
      <span class="filter-label">元素</span>
      <div class="filter-tags" id="element-filters">
        <button class="tag active" data-type="element" data-value="all">全部</button>
        <button class="tag" data-type="element" data-value="火">火</button>
        <button class="tag" data-type="element" data-value="水">水</button>
        <button class="tag" data-type="element" data-value="风">风</button>
        <button class="tag" data-type="element" data-value="雷">雷</button>
        <button class="tag" data-type="element" data-value="冰">冰</button>
        <button class="tag" data-type="element" data-value="草">草</button>
        <button class="tag" data-type="element" data-value="岩">岩</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">地区</span>
      <div class="filter-tags" id="region-filters">
        <button class="tag active" data-type="region" data-value="all">全部</button>
        <button class="tag" data-type="region" data-value="蒙德">蒙德</button>
        <button class="tag" data-type="region" data-value="璃月">璃月</button>
        <button class="tag" data-type="region" data-value="稻妻">稻妻</button>
        <button class="tag" data-type="region" data-value="须弥">须弥</button>
        <button class="tag" data-type="region" data-value="枫丹">枫丹</button>
        <button class="tag" data-type="region" data-value="纳塔">纳塔</button>
        <button class="tag" data-type="region" data-value="至冬">至冬</button>
        <button class="tag" data-type="region" data-value="星海">星海</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">稀有度</span>
      <div class="filter-tags" id="rarity-filters">
        <button class="tag active" data-type="rarity" data-value="all">全部</button>
        <button class="tag" data-type="rarity" data-value="5">★★★★★</button>
        <button class="tag" data-type="rarity" data-value="4">★★★★</button>
      </div>
    </div>
    <div class="filter-group">
      <span class="filter-label">武器</span>
      <div class="filter-tags" id="weapon-filters">
        <button class="tag active" data-type="weapon" data-value="all">全部</button>
        <button class="tag" data-type="weapon" data-value="单手剑">单手剑</button>
        <button class="tag" data-type="weapon" data-value="双手剑">双手剑</button>
        <button class="tag" data-type="weapon" data-value="长柄武器">长柄武器</button>
        <button class="tag" data-type="weapon" data-value="弓">弓</button>
        <button class="tag" data-type="weapon" data-value="法器">法器</button>
      </div>
    </div>
    <div class="search-group">
      <span class="filter-label">搜索</span>
      <input type="text" id="search-input" class="search-input" placeholder="输入角色名称…">
    </div>
    <div class="filter-group">
      <span class="filter-label">排序</span>
      <select id="sort-select" class="sort-select">
        <option value="default">默认</option>
        <option value="rarity-desc">星级高→低</option>
        <option value="birthday">生日近→远</option>
      </select>
    </div>
    <label class="fav-toggle">
      <input type="checkbox" id="fav-only"> 仅看收藏
    </label>
    <span class="result-count" id="result-count"></span>
  </section>

  <!-- 今日寿星 -->
  <section class="birthday-banner" id="birthday-banner" style="display:none"></section>

  <!-- 角色卡片网格 -->
  <main class="character-grid" id="character-grid"></main>

  <!-- 角色详情模态弹窗 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="关闭">&times;</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="site-footer">
    <p>本网站为粉丝向作品，角色数据来源基于《原神》游戏。</p>
    <p>&copy; 2026 提瓦特旅人录 · 星海纪行</p>
  </footer>

  <canvas id="sky-canvas"></canvas>
  <script src="js/data.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/main.js"></script>
  <div id="pwa-install-bar" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:rgba(6,12,44,0.95);border-top:1px solid rgba(201,169,110,0.3);padding:12px 20px;display:flex;gap:12px;justify-content:center;align-items:center;">
    <button id="pwa-install-btn" style="background:linear-gradient(135deg,#957545,#d4b474);border:none;color:#fff;padding:12px 28px;border-radius:24px;font-size:1rem;font-family:inherit;cursor:pointer;letter-spacing:2px;">📱 安装到桌面</button>
    <button id="pwa-dismiss-btn" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:1.2rem;cursor:pointer;">✕</button>
  </div>
  <script>
    // 临时禁用 SW 避免缓存问题
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        for (var i = 0; i < regs.length; i++) regs[i].unregister();
      });
    }
    var deferredPrompt;
    window.addEventListener("beforeinstallprompt", function (e) {
      deferredPrompt = e;
    });
    document.getElementById("pwa-install-btn").addEventListener("click", function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          document.getElementById("pwa-install-bar").remove();
          deferredPrompt = null;
        });
      } else {
        alert("请使用浏览器菜单中的「添加到主屏幕」功能");
      }
    });
    document.getElementById("pwa-dismiss-btn").addEventListener("click", function () {
      document.getElementById("pwa-install-bar").remove();
    });
  </script>
</body>
</html>
